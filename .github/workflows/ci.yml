name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

# Cancel stale runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit test
        run: cargo test --workspace --exclude podseq-e2e --locked

  # Fails only when a PR makes a function's CRAP score worse than the
  # committed baseline. Regenerate the baseline locally with
  # `make crap-baseline` as part of a PR that improves CRAP scores.
  crap:
    name: cargo-crap
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov and cargo-crap
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-crap

      - name: Generate LCOV coverage
        run: cargo llvm-cov --workspace --exclude podseq-e2e --lcov --output-path lcov.info

      - name: Fail on regression
        run: cargo crap --lcov lcov.info --baseline crap_baseline.json --fail-regression

  move:
    name: move build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move
    steps:
      - uses: actions/checkout@v7

      - name: Install Sui CLI (testnet toolchain)
        uses: ./.github/actions/install-sui
        with:
          move-toml: move/Move.toml

      - name: Build settlement package
        run: sui move build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build podseq image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: podseq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the binary
        run: docker run --rm --entrypoint podseq podseq:ci --help

  e2e:
    name: e2e (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The tests bring up their own Reth container via docker compose.
      - name: Run e2e tests
        run: cargo test -p podseq-e2e --no-fail-fast --test engine_integration --test bridge_bootstrap -- --test-threads=1 --nocapture

  # Runs on every PR/push (non-blocking) and on the daily schedule + manual dispatch (blocking).
  e2e-full:
    name: e2e (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Sui CLI (testnet toolchain)
        uses: ./.github/actions/install-sui
        with:
          move-toml: move/Move.toml

      - name: Build settlement package
        working-directory: move
        run: sui move build

      - name: Run full-stack e2e
        env:
          SUI_SIGNER_KEY: ${{ secrets.SUI_SIGNER_KEY }}
        run: cargo test -p podseq-e2e --no-fail-fast --test full_stack -- --nocapture --test-threads=1
