name: Install Sui CLI
description: Installs the Sui CLI release pinned by the `rev` field in a Move.toml.

inputs:
  move-toml:
    description: Path to the Move.toml whose `rev` field pins the Sui release.
    required: true

runs:
  using: composite
  steps:
    - name: Install Sui CLI (testnet toolchain)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        SUI_TAG=$(grep '^rev = ' "${{ inputs.move-toml }}" | sed 's/rev = "//;s/"//')
        echo "Installing Sui CLI $SUI_TAG (from ${{ inputs.move-toml }})"
        mkdir -p "$HOME/.local/bin"
        gh release download "$SUI_TAG" -R MystenLabs/sui \
          -p '*ubuntu-x86_64.tgz' -D /tmp
        tar -xzf /tmp/*ubuntu-x86_64.tgz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
