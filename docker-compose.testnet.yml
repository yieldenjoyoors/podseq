# Testnet override: Walrus testnet + Sui testnet.
#
#   docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d

name: podseq-testnet

services:
  reth:
    container_name: reth-testnet
    ports:
      - "8545:8545" # JSON-RPC
      - "8551:8551" # Engine API
      - "9001:9001/tcp" # P2P
      - "9001:9001/udp"

  faucet:
    container_name: faucet-testnet

  podseq:
    container_name: podseq-testnet
    volumes:
      # Override the image default with the testnet config.
      - ./docker/podseq.testnet.toml:/etc/podseq/podseq.toml:ro
