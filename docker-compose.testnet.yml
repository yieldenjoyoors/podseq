# Testnet override: Walrus testnet + Sui testnet.
#
#   docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d

name: podseq-testnet

services:
  reth:
    container_name: reth-testnet
    ports:
      - "8545:8545" # JSON-RPC
      - "8551:8551" # Engine API
      - "9001:9001/tcp" # P2P
      - "9001:9001/udp"

  blockscout-db:
    container_name: blockscout-db-testnet

  blockscout-redis:
    container_name: blockscout-redis-testnet

  blockscout-backend:
    container_name: blockscout-backend-testnet

  blockscout-frontend:
    container_name: blockscout-frontend-testnet

  faucet:
    # Development-only ETH faucet. Connects to the local Reth JSON-RPC and
    # dispenses test ETH. The default key is the well-known Hardhat/Anvil
    # account #0, pre-funded in examples/reth-genesis.json. Override with a
    # funded key of your own:
    #   FAUCET_PRIVATE_KEY=0x... docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d
    container_name: faucet-testnet
    image: chainflag/eth-faucet:latest
    depends_on:
      reth:
        condition: service_started
    # The payout amount has no env var; it is a flag only.
    command: ["-faucet.amount=0.1"]
    environment:
      WEB3_PROVIDER: http://reth:8545
      PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    ports:
      - "8080:8080"
    restart: unless-stopped

  podseq:
    container_name: podseq-testnet
    volumes:
      # Override the image default with the testnet config. Read-write: a
      # first-start settlement deploy persists the deployed IDs into it.
      - ./docker/podseq.testnet.toml:/etc/podseq/podseq.toml
