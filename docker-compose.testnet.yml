# Testnet override: Walrus testnet + Sui testnet.
#
#   docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d

name: podseq-testnet

services:
  reth:
    container_name: reth-testnet
    ports:
      - "8545:8545" # JSON-RPC
      - "8551:8551" # Engine API
      - "9001:9001/tcp" # P2P
      - "9001:9001/udp"

  blockscout-db:
    container_name: blockscout-db-testnet

  blockscout-redis:
    container_name: blockscout-redis-testnet

  blockscout-backend:
    container_name: blockscout-backend-testnet

  blockscout-frontend:
    container_name: blockscout-frontend-testnet

  faucet:
    # Development-only ETH faucet. Connects to the local Reth JSON-RPC and
    # dispenses test ETH. Disable by removing or commenting out this service.
    #   FAUCET_PRIVATE_KEY=0x... docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d
    container_name: faucet-testnet
    image: chainflag/eth-faucet:latest
    depends_on:
      reth:
        condition: service_started
    environment:
      WEB3_PROVIDER: http://reth:8545
      PRIVATE_KEY: ${FAUCET_PRIVATE_KEY}
    ports:
      - "8080:8080"
    restart: unless-stopped

  podseq:
    container_name: podseq-testnet
    volumes:
      # Override the image default with the testnet config.
      - ./docker/podseq.testnet.toml:/etc/podseq/podseq.toml:ro
